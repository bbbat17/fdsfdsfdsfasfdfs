<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티플레이 총싸움 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 { margin: 5px 0; font-size: 24px; }
        #status { font-size: 16px; color: #ffeb3b; margin-bottom: 10px; font-weight: bold; }
        .info { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        
        /* 초기화 버튼 스타일 */
        #resetRoomBtn {
            margin-bottom: 15px;
            padding: 8px 15px;
            background-color: #ff3366;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        #resetRoomBtn:hover {
            background-color: #e02251;
            transform: scale(1.05);
        }
        
        canvas {
            background-color: #111;
            border: 4px solid #444;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>💥 REALTIME SHOWDOWN 💥</h1>
    <div id="status">서버 연결 중...</div>
    
    <!-- [1단계] 화면에 초기화 버튼 추가 완료! -->
    <button id="resetRoomBtn">방 강제 초기화 (유령유저 제거)</button>
    
    <div class="info">이동: 방향키(▲▼◀▶) 또는 WASD | 발사: Spacebar 또는 Enter</div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDaU42SyXM_k_Bm0qwADH-MqWnTeLbXCD0",
            authDomain: "dfdsfdsfd-18525.firebaseapp.com",
            databaseURL: "https://dfdsfdsfd-18525-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dfdsfdsfd-18525",
            storageBucket: "dfdsfdsfd-18525.firebasestorage.app",
            messagingSenderId: "800852256342",
            appId: "1:800852256342:web:cf57a4808d44d0596ffdf7",
            measurementId: "G-GG10ZTPMEQ"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        // [2단계] 자바스크립트 버튼 기능 연결 완료!
        document.getElementById('resetRoomBtn').addEventListener('click', () => {
            if (confirm("방이 꽉 찼거나 유령 유저가 있나요? 방을 완전히 초기화합니다.")) {
                set(ref(database, 'game'), null); // 파이어베이스 데이터 삭제
                location.reload(); // 내 창 새로고침
            }
        });

        const myId = "user_" + Math.random().toString(36).substr(2, 9);
        let myRole = null; 

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        const keys = {};
        let playersData = {};
        let localBullets = [];
        const bulletSpeed = 7;
        const shootDelay = 400;
        let lastShotTime = 0;

        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        const playersRef = ref(database, 'game/players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val() || {};
            playersData = data;

            const slots = Object.keys(data);
            const myExistingSlot = slots.find(slot => data[slot].id === myId);

            if (myExistingSlot) {
                myRole = myExistingSlot;
            } else if (!data['p1']) {
                myRole = 'p1';
                set(ref(database, 'game/players/p1'), { id: myId, x: 100, y: 225, hp: 100, dir: 1, color: '#00d2ff' });
            } else if (!data['p2']) {
                myRole = 'p2';
                set(ref(database, 'game/players/p2'), { id: myId, x: 700, y: 225, hp: 100, dir: -1, color: '#ff3366' });
            } else {
                myRole = 'spectator'; 
            }

            if (myRole === 'p1') statusEl.innerText = "당신은 🔵 1P (Blue) 입니다. 상대방을 기다리는 중...";
            if (myRole === 'p2') statusEl.innerText = "당신은 🔴 2P (Red) 입니다. 게임 시작!";
            if (data['p1'] && data['p2']) {
                if (myRole !== 'spectator') statusEl.innerText = `전투 중! (내 체력: ${data[myRole].hp})`;
                else statusEl.innerText = "방이 가득 찼습니다. 관전 중...";
            }
        });

        window.addEventListener('beforeunload', () => {
            if (myRole && myRole !== 'spectator') {
                set(ref(database, `game/players/${myRole}`), null);
            }
        });

        const bulletsRef = ref(database, 'game/bullets');
        onChildAdded(bulletsRef, (snapshot) => {
            const b = snapshot.val();
            localBullets.push(b);
        });

        function fireBullet() {
            if (!myRole || myRole === 'spectator' || !playersData['p1'] || !playersData['p2']) return;
            const now = Date.now();
            if (now - lastShotTime > shootDelay) {
                const me = playersData[myRole];
                if (me.hp <= 0) return;

                push(bulletsRef, {
                    x: me.x + (20 * me.dir),
                    y: me.y,
                    dir: me.dir,
                    owner: myRole,
                    color: me.color
                });
                lastShotTime = now;
            }
        }

        function update() {
            if (!myRole || myRole === 'spectator' || !playersData[myRole]) return;
            
            const me = playersData[myRole];
            if (me.hp <= 0) return;

            let moved = false;

            if (keys['KeyW'] || keys['ArrowUp']) { if (me.y - 20 > 0) { me.y -= 4; moved = true; } }
            if (keys['KeyS'] || keys['ArrowDown']) { if (me.y + 20 < canvas.height) { me.y += 4; moved = true; } }
            if (keys['KeyA'] || keys['ArrowLeft']) { if (me.x - 20 > 0) { me.x -= 4; me.dir = -1; moved = true; } }
            if (keys['KeyD'] || keys['ArrowRight']) { if (me.x + 20 < canvas.width) { me.x += 4; me.dir = 1; moved = true; } }
            
            if (keys['Space'] || keys['Enter']) {
                fireBullet();
            }

            if (moved) {
                set(ref(database, `game/players/${myRole}`), me);
            }

            if (myRole === 'p1' && playersData['p2']) {
                for (let i = localBullets.length - 1; i >= 0; i--) {
                    const b = localBullets[i];
                    
                    if (b.owner === 'p1') {
                        let dist = Math.hypot(b.x - playersData['p2'].x, b.y - playersData['p2'].y);
                        if (dist < 20 && playersData['p2'].hp > 0) {
                            set(ref(database, 'game/players/p2/hp'), Math.max(0, playersData['p2'].hp - 10));
                            localBullets.splice(i, 1);
                            continue;
                        }
                    }
                    if (b.owner === 'p2') {
                        let dist = Math.hypot(b.x - playersData['p1'].x, b.y - playersData['p1'].y);
                        if (dist < 20 && playersData['p1'].hp > 0) {
                            set(ref(database, 'game/players/p1/hp'), Math.max(0, playersData['p1'].hp - 10));
                            localBullets.splice(i, 1);
                            continue;
                        }
                    }
                }
            }

            if (playersData['p1'] && playersData['p2']) {
                if (playersData['p1'].hp <= 0 || playersData['p2'].hp <= 0) {
                    const winner = playersData['p1'].hp <= 0 ? "2P (Red)" : "1P (Blue)";
                    alert(`🎉 ${winner} 승리! 게임을 재시작합니다.`);
                    set(ref(database, 'game'), null);
                    localBullets = [];
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = localBullets.length - 1; i >= 0; i--) {
                const b = localBullets[i];
                b.x += b.dir * bulletSpeed;

                if (b.x < 0 || b.x > canvas.width) {
                    localBullets.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            Object.keys(playersData).forEach(slot => {
                const p = playersData[slot];
                if (p.hp <= 0) return;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.fillRect(p.x + (20 * p.dir) - 2, p.y - 2, 4, 4);

                ctx.fillStyle = '#555';
                ctx.fillRect(p.x - 20, p.y - 32, 40, 6);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - 20, p.y - 32, 40 * (p.hp / 100), 6);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
